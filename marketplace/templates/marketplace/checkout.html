<div class="container" style="max-width: 900px; margin: 2rem auto;">
  <h1>Course Checkout</h1>
  <p>Buy once, get lifetime access.</p>
  <div style="display:grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap: 16px;">
    {% for course in courses %}
      <div style="border:1px solid #ddd; padding:16px; border-radius:12px;">
        <h3>{{ course.title }}</h3>
        <p>{{ course.description|truncatewords:20 }}</p>
        <p><strong>{{ course.price }} EGP</strong></p>
        <button class="buy-btn" data-course-id="{{ course.id }}">Buy Course</button>
      </div>
    {% empty %}
      <p>No courses available yet.</p>
    {% endfor %}
  </div>
</div>
<script>
async function buyCourse(courseId){
  const resp = await fetch('/api/marketplace/student/buy-course/', {
    method:'POST',
    headers:{'Content-Type':'application/json','X-CSRFToken':'{{ csrf_token }}'},
    body:JSON.stringify({course_id:courseId,idempotency_key:crypto.randomUUID()})
  });
  if(resp.ok){ alert('Purchase intent created successfully'); }
  else{ alert('Failed to create purchase'); }
}
document.querySelectorAll('.buy-btn').forEach(btn=>btn.addEventListener('click',()=>buyCourse(btn.dataset.courseId)));
</script>
