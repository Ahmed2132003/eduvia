<div class="container" style="max-width: 900px; margin: 2rem auto; font-family: Arial, sans-serif;">
  <h1>Course Checkout</h1>
  <p>Choose payment method or activate enrollment code.</p>

  {% if course %}
    <div style="border:1px solid #ddd; padding:16px; border-radius:12px; margin-bottom:16px;">
      <h3>{{ course.title }}</h3>
      <p><strong>{{ course.price }} EGP</strong></p>
      <button onclick="proceedPaymob({{ course.id }})">Proceed to Payment</button>
    </div>

    <div style="border:1px solid #ddd; padding:16px; border-radius:12px;">
      <h3>Have Enrollment Code?</h3>
      <input id="enroll-code" placeholder="Enter code" style="padding:8px; width:280px;" />
      <button onclick="activateCode({{ course.id }})">Activate Course</button>
    </div>
  {% else %}
    <div style="display:grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap: 16px;">
      {% for c in courses %}
        <div style="border:1px solid #ddd; padding:16px; border-radius:12px;">
          <h3>{{ c.title }}</h3>
          <p>{{ c.description|truncatewords:20 }}</p>
          <p><strong>{{ c.price }} EGP</strong></p>
          <a href="/api/marketplace/checkout/?course_id={{ c.id }}">Checkout</a>
        </div>
      {% endfor %}
    </div>
  {% endif %}
</div>
<script>
function csrfToken(){return '{{ csrf_token }}'}
async function proceedPaymob(courseId){
  const r = await fetch(`/api/marketplace/courses/${courseId}/checkout/paymob/`, {method:'POST', headers:{'X-CSRFToken':csrfToken()}});
  const data = await r.json();
  if(r.ok && data.redirect_url){ window.location.href = data.redirect_url; return; }
  alert(data.detail || 'Failed to start payment');
}
async function activateCode(courseId){
  const code = document.getElementById('enroll-code').value;
  const r = await fetch(`/api/marketplace/courses/${courseId}/activate-code/`, {
    method:'POST', headers:{'Content-Type':'application/json','X-CSRFToken':csrfToken()}, body:JSON.stringify({code})
  });
  if(r.ok){ 
    alert('تم تفعيل الكورس بنجاح!'); 
    window.location.href='/courses/';  // ← روح لصفحة الكورسات مش details
    return; 
  }
  const err = await r.json(); alert(err.detail || 'Invalid code');
}
</script>
