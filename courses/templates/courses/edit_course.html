{% load static i18n course_tags %}

<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title data-translate="page-title">Edit Course - Eduvia</title>
    <meta name="description" content="Edit your courses on Eduvia's Instructor Dashboard. Update course details and manage educational content with ease." data-translate="meta-desc">
    <meta name="keywords" content="Eduvia, edit course, instructor dashboard, course management, educational platform" data-translate="meta-keywords">
    <meta name="description" lang="ar" content="تعديل دوراتك على لوحة تحكم المدربين في إدوفيا. تحديث تفاصيل الدورة وإدارة المحتوى التعليمي بسهولة." data-translate="meta-desc-ar">
    <meta name="keywords" lang="ar" content="إدوفيا، تعديل الدورة، لوحة تحكم المدربين، إدارة الدورات، منصة تعليمية" data-translate="meta-keywords-ar">
    <meta name="author" content="Eduvia Team">
    <meta name="robots" content="index, follow">
    <meta http-equiv="content-language" content="ar, en">
    <link rel="canonical" href="{{ request.build_absolute_uri }}">

    <!-- Open Graph -->
    <meta property="og:title" content="Edit Course - Eduvia" data-translate="og-title">
    <meta property="og:description" content="Easily update and manage your course content on Eduvia's Instructor Dashboard." data-translate="og-desc">
    <meta property="og:image" content="https://i.postimg.cc/x1QZtzVs/edit-course.jpg">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Edit Course - Eduvia" data-translate="twitter-title">
    <meta name="twitter:description" content="Easily update and manage your course content on Eduvia's Instructor Dashboard." data-translate="twitter-desc">
    <meta name="twitter:image" content="https://i.postimg.cc/x1QZtzVs/edit-course.jpg">

    <!-- Favicon -->
    <link rel="icon" href="https://i.postimg.cc/pLFTCC2z/logo-eduvia1.png" type="image/png">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="{% static 'courses/edit_course.css' %}">

    <!-- Hero Background -->
    <style>
        :root {
            --hero-bg-image: url("https://i.postimg.cc/wTWNn0gH/dashboard-1.jpg");
        }
    </style>

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "Organization",
                "@id": "https://eduvia-ai.fly.dev/#organization",
                "name": "Eduvia",
                "url": "https://eduvia-ai.fly.dev",
                "logo": {
                    "@type": "ImageObject",
                    "url": "https://i.postimg.cc/pLFTCC2z/logo-eduvia1.png"
                },
                "sameAs": [
                    "https://www.facebook.com/share/18iRSctdxN/",
                    "https://x.com/Eduvia7",
                    "https://www.linkedin.com/in/eduvia-creativitycode-964ba7366/"
                ]
            },
            {
                "@type": "WebPage",
                "@id": "https://eduvia-ai.fly.dev/courses/edit_course/{{ course.id }}/#webpage",
                "url": "https://eduvia-ai.fly.dev/courses/edit_course/{{ course.id }}/",
                "name": "Edit Course - Eduvia",
                "description": "Edit your courses on Eduvia's Instructor Dashboard. Update course details and manage educational content with ease.",
                "breadcrumb": {
                    "@id": "https://eduvia-ai.fly.dev/courses/edit_course/{{ course.id }}/#breadcrumb"
                },
                "inLanguage": "en"
            },
            {
                "@type": "BreadcrumbList",
                "@id": "https://eduvia-ai.fly.dev/courses/edit_course/{{ course.id }}/#breadcrumb",
                "itemListElement": [
                    {
                        "@type": "ListItem",
                        "position": 1,
                        "name": "Eduvia",
                        "item": "https://eduvia-ai.fly.dev/"
                    },
                    {
                        "@type": "ListItem",
                        "position": 2,
                        "name": "Instructor Dashboard",
                        "item": "https://eduvia-ai.fly.dev/courses/instructor_dashboard/"
                    },
                    {
                        "@type": "ListItem",
                        "position": 3,
                        "name": "Edit Course",
                        "item": "https://eduvia-ai.fly.dev/courses/edit_course/{{ course.id }}/"
                    }
                ]
            }
        ]
    }
    </script>
</head>

<body>

<!-- Header -->
<header class="header">
    <div class="logo" data-translate="title">Eduvia</div>
</header>

<!-- Hero -->
<section class="hero">
    <h1 data-translate="hero-title">Edit Course</h1>
</section>

<!-- Content -->
<div class="content">
    <div class="overview-card">
        <h2 data-translate="edit-course-title">Edit Course</h2>

        <form method="post" action="{% url 'courses:edit_course' course_id=course.id course_slug=slugified_course_title|arabic_slug:course.id %}">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="form-group" style="
              margin-top: 20px;
              background: linear-gradient(135deg,#fef9f0,#fff8e1);
              border: 1.5px solid #f59e0b;
              border-radius: 10px;
              padding: 18px 20px;
            ">
              <label style="
                display: flex; align-items: flex-start; gap: 14px;
                cursor: pointer; user-select: none;
              ">
                <input type="checkbox" name="is_finished" id="id_is_finished"
                  {% if form.instance.is_finished %}checked{% endif %}
                  style="width:20px;height:20px;margin-top:2px;accent-color:#f59e0b;flex-shrink:0;cursor:pointer;">
                <div>
                  <div style="font-size:15px;font-weight:700;color:#92400e;margin-bottom:4px;">
                    <i class="fas fa-flag-checkered"></i>
                    Mark Course as Finished / Completed
                  </div>
                  <div style="font-size:13px;color:#a16207;line-height:1.6;">
                    When checked, students who have completed all lessons will be able
                    to download their <strong>Certificate of Completion</strong>.
                    Only mark this when the course content is fully published.
                  </div>
                </div>
              </label>
            </div>

            <button type="submit" class="btn" data-translate="save-changes">Save Changes</button>
        </form>
    </div>
</div>

<!-- Footer -->
<footer class="footer">
    <p data-translate="footer-text">© 2025 Eduvia and creativitycode. All rights reserved.</p>
</footer>

<script src="{% static 'courses/edit_course.js' %}"></script>

</body>
</html>
