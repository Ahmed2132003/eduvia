<!DOCTYPE html>
{% load static %}
<html lang="en" dir="ltr" id="html-root" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 🔍 SEO -->
    <title data-translate="title">Login - Eduvia</title>
    <meta name="description" content="Login to Eduvia to access interactive AI-integrated courses in programming, mathematics, and English.">
    <meta name="keywords" content="Eduvia, login, online courses, education platform, interactive learning">
    <meta name="author" content="Eduvia Team">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ request.build_absolute_uri }}">

    <!-- 🌍 Open Graph -->
    <meta property="og:title" content="Login - Eduvia">
    <meta property="og:description" content="Login to Eduvia to access interactive AI-integrated courses in programming, mathematics, and English.">
    <meta property="og:image" content="https://i.postimg.cc/3JrZfCbb/logo-eduvia1.jpg">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    <meta property="og:type" content="website">

    <!-- 🐦 Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Login - Eduvia">
    <meta name="twitter:description" content="Login to Eduvia to access interactive AI-integrated courses in programming, mathematics, and English.">
    <meta name="twitter:image" content="https://i.postimg.cc/3JrZfCbb/logo-eduvia1.jpg">

    <!-- 🖼️ Favicon -->
    <link rel="icon" href="https://i.postimg.cc/pLFTCC2z/logo-eduvia1.png" type="image/png">

    <!-- 🌐 Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- 🎨 Styles -->
    <link rel="stylesheet" href="{% static 'accounts/login.css' %}">

    <!-- 📊 Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "Organization",
                "@id": "https://eduvia-ai.fly.dev/#organization",
                "name": "Eduvia",
                "url": "https://eduvia-ai.fly.dev",
                "logo": {
                    "@type": "ImageObject",
                    "url": "https://i.postimg.cc/pLFTCC2z/logo-eduvia1.png"
                }
            },
            {
                "@type": "WebPage",
                "@id": "https://eduvia-ai.fly.dev/accounts/login/#webpage",
                "url": "https://eduvia-ai.fly.dev/accounts/login/",
                "name": "Login - Eduvia",
                "description": "Login to Eduvia to access interactive AI-integrated courses.",
                "inLanguage": "en"
            }
        ]
    }
    </script>
</head>
<body>

<!-- Animated background -->
<div class="auth-bg" aria-hidden="true">
    <div class="auth-bg-orb auth-bg-orb-1"></div>
    <div class="auth-bg-orb auth-bg-orb-2"></div>
    <div class="auth-bg-orb auth-bg-orb-3"></div>
</div>

<!-- Theme / Language toggles -->
<div class="toggle-container" role="toolbar" aria-label="Settings">
    <button class="ctrl-btn" onclick="toggleDarkMode()" title="Toggle theme" aria-label="Toggle theme">
        <i class="fas fa-moon" id="theme-icon"></i>
    </button>
    <button class="ctrl-btn" onclick="toggleLanguage()" title="Toggle language" aria-label="Toggle language">
        <i class="fas fa-globe"></i>
    </button>
</div>

{% block content %}
<main class="auth-wrapper" role="main">
    <div class="auth-card">

        <!-- Logo -->
        <div class="auth-logo-wrap">
            <img src="{% static 'images/logo_eduvia1.jpg' %}" alt="Eduvia Logo" class="auth-logo">
            <span class="auth-brand">Eduvia</span>
        </div>

        <!-- Heading -->
        <h1 class="auth-heading" data-translate="heading">Welcome back</h1>
        <p class="auth-subheading" data-translate="subheading">Sign in to continue your learning journey</p>

        <!-- Server messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <!-- Login form -->
        <form method="post" class="auth-form" onsubmit="return handleSubmit(this)" novalidate>
            {% csrf_token %}

            <!-- Username -->
            <div class="field-group">
                <label class="field-label" for="username" data-translate="label-username">Username</label>
                <div class="input-wrap">
                    <i class="fas fa-user input-icon" aria-hidden="true"></i>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="auth-input"
                        placeholder="Enter your username"
                        required
                        autocomplete="username"
                        aria-required="true"
                    >
                </div>
            </div>

            <!-- Password -->
            <div class="field-group">
                <label class="field-label" for="password" data-translate="label-password">Password</label>
                <div class="input-wrap">
                    <i class="fas fa-lock input-icon" aria-hidden="true"></i>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="auth-input"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                        aria-required="true"
                    >
                    <button type="button" class="pw-toggle" onclick="togglePassword()" aria-label="Toggle password visibility">
                        <i class="fas fa-eye" id="pw-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit" class="auth-btn" data-translate="button-login">
                <i class="fas fa-sign-in-alt"></i>
                Sign In
            </button>
        </form>

        <!-- Footer -->
        <div class="auth-footer">
            <span data-translate="footer-text">Don't have an account?</span>
            <a href="/accounts/register/" class="auth-link" data-translate="footer-link">Create one</a>
        </div>

    </div>
</main>
{% endblock %}

<script src="{% static 'accounts/login.js' %}"></script>
</body>
</html>
