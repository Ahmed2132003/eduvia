<!DOCTYPE html>
{% load static %}
<html lang="en" dir="ltr" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 🔍 SEO -->
    <title data-translate="title">Login - Eduvia</title>
    <meta name="description" content="Login to Eduvia to access interactive AI-integrated courses in programming, mathematics, and English.">
    <meta name="keywords" content="Eduvia, login, online courses, education platform, interactive learning">
    <meta name="author" content="Eduvia Team">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ request.build_absolute_uri }}">

    <!-- 🌍 Open Graph -->
    <meta property="og:title" content="Login - Eduvia">
    <meta property="og:description" content="Login to Eduvia to access interactive AI-integrated courses in programming, mathematics, and English.">
    <meta property="og:image" content="https://i.postimg.cc/3JrZfCbb/logo-eduvia1.jpg">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    <meta property="og:type" content="website">

    <!-- 🐦 Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Login - Eduvia">
    <meta name="twitter:description" content="Login to Eduvia to access interactive AI-integrated courses in programming, mathematics, and English.">
    <meta name="twitter:image" content="https://i.postimg.cc/3JrZfCbb/logo-eduvia1.jpg">

    <!-- 🖼️ Favicon -->
    <link rel="icon" href="https://i.postimg.cc/pLFTCC2z/logo-eduvia1.png" type="image/png">

    <!-- 🌐 Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- 🎨 Styles -->
    <link rel="stylesheet" href="{% static 'accounts/login.css' %}">

    <!-- 🖼️ Hero Background -->
    <style>
        :root {
            --hero-bg-image: url("https://i.postimg.cc/3JrZfCbb/logo-eduvia1.jpg");
        }
    </style>

    <!-- 📊 Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "Organization",
                "@id": "https://eduvia-ai.fly.dev/#organization",
                "name": "Eduvia",
                "url": "https://eduvia-ai.fly.dev",
                "logo": {
                    "@type": "ImageObject",
                    "url": "https://i.postimg.cc/pLFTCC2z/logo-eduvia1.png"
                },
                "sameAs": [
                    "https://www.facebook.com/share/18iRSctdxN/",
                    "https://x.com/Eduvia7",
                    "https://www.linkedin.com/in/eduvia-creativitycode-964ba7366/"
                ]
            },
            {
                "@type": "WebPage",
                "@id": "https://eduvia-ai.fly.dev/accounts/login/#webpage",
                "url": "https://eduvia-ai.fly.dev/accounts/login/",
                "name": "Login - Eduvia",
                "description": "Login to Eduvia to access interactive AI-integrated courses in programming, mathematics, and English.",
                "breadcrumb": {
                    "@id": "https://eduvia-ai.fly.dev/accounts/login/#breadcrumb"
                },
                "inLanguage": "en"
            },
            {
                "@type": "BreadcrumbList",
                "@id": "https://eduvia-ai.fly.dev/accounts/login/#breadcrumb",
                "itemListElement": [
                    {
                        "@type": "ListItem",
                        "position": 1,
                        "name": "Eduvia",
                        "item": "https://eduvia-ai.fly.dev/"
                    },
                    {
                        "@type": "ListItem",
                        "position": 2,
                        "name": "Login",
                        "item": "https://eduvia-ai.fly.dev/accounts/login/"
                    }
                ]
            }
        ]
    }
    </script>
</head>
<body>
<div class="toggle-container">
    <div class="dark-mode-toggle" onclick="toggleDarkMode()">
        <i class="fas fa-moon"></i>
    </div>
    <div class="language-toggle" onclick="toggleLanguage()">
        <i class="fas fa-globe"></i>
    </div>
</div>

{% block content %}
<div class="container">
    <img src="{% static 'images/logo_eduvia1.jpg' %}" alt="Eduvia Logo" class="logo">
    <h1 data-translate="heading">Login to Eduvia</h1>
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div>
            <label for="username" data-translate="label-username">Username:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div>
            <label for="password" data-translate="label-password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" data-translate="button-login">Login</button>
    </form>
    <div class="footer">
        <p>Already have an register? <a href="/accounts/register/" data-translate="footer-link">register here</a></p>
    </div>
</div>
{% endblock %}

<script src="{% static 'accounts/login.js' %}"></script>
</body>
</html>
