<!DOCTYPE html>
{% load static %}
<html lang="en" dir="ltr" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 🔍 SEO -->
    <title data-translate="title">Verify Your Account - Eduvia</title>
    <meta name="description" content="Verify your Eduvia account to complete registration.">
    <meta name="keywords" content="Eduvia, verify, online courses, education platform">
    <meta name="author" content="Eduvia Team">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ request.build_absolute_uri }}">

    <!-- 🌍 Open Graph -->
    <meta property="og:title" content="Verify Your Account - Eduvia">
    <meta property="og:description" content="Verify your Eduvia account to complete registration.">
    <meta property="og:image" content="https://i.postimg.cc/3JrZfCbb/logo-eduvia1.jpg">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    <meta property="og:type" content="website">

    <!-- 🐦 Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Verify Your Account - Eduvia">
    <meta name="twitter:description" content="Verify your Eduvia account to complete registration.">
    <meta name="twitter:image" content="https://i.postimg.cc/3JrZfCbb/logo-eduvia1.jpg">

    <!-- 🖼️ Favicon -->
    <link rel="icon" href="https://i.postimg.cc/pLFTCC2z/logo-eduvia1.png" type="image/png">

    <!-- 🌐 Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

    <!-- 🎨 Styles -->
    <link rel="stylesheet" href="{% static 'accounts/verify_code.css' %}">

    <!-- 📊 Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "Organization",
                "@id": "https://eduvia-ai.fly.dev/#organization",
                "name": "Eduvia",
                "url": "https://eduvia-ai.fly.dev",
                "logo": {
                    "@type": "ImageObject",
                    "url": "https://i.postimg.cc/pLFTCC2z/logo-eduvia1.png"
                },
                "sameAs": [
                    "https://www.facebook.com/share/18iRSctdxN/",
                    "https://x.com/Eduvia7",
                    "https://www.linkedin.com/in/eduvia-creativitycode-964ba7366/"
                ]
            },
            {
                "@type": "WebPage",
                "@id": "https://eduvia-ai.fly.dev/accounts/verify_code/#webpage",
                "url": "https://eduvia-ai.fly.dev/accounts/verify_code/",
                "name": "Verify Your Account - Eduvia",
                "description": "Verify your Eduvia account to complete registration.",
                "breadcrumb": {
                    "@id": "https://eduvia-ai.fly.dev/accounts/verify_code/#breadcrumb"
                },
                "inLanguage": "en"
            },
            {
                "@type": "BreadcrumbList",
                "@id": "https://eduvia-ai.fly.dev/accounts/verify_code/#breadcrumb",
                "itemListElement": [
                    {
                        "@type": "ListItem",
                        "position": 1,
                        "name": "Eduvia",
                        "item": "https://eduvia-ai.fly.dev/"
                    },
                    {
                        "@type": "ListItem",
                        "position": 2,
                        "name": "Verify Account",
                        "item": "https://eduvia-ai.fly.dev/accounts/verify_code/"
                    }
                ]
            }
        ]
    }
    </script>
</head>
<body>
<div class="toggle-container">
    <div class="dark-mode-toggle" onclick="toggleDarkMode()">
        <i class="fas fa-moon"></i>
    </div>
    <div class="language-toggle" onclick="toggleLanguage()">
        <i class="fas fa-globe"></i>
    </div>
</div>

<div class="container">
    <img src="{% static 'images/logo_eduvia1.jpg' %}" alt="Eduvia Logo" class="logo">
    <h2 data-translate="heading">Verify Your Account</h2>
    <p data-translate="subheading">Enter the verification code sent to your email.</p>
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    <form method="post" action="{% url 'accounts:verify_code' %}">
        {% csrf_token %}
        <label for="verification_code" data-translate="label-verification_code">Enter Verification Code:</label>
        <input type="text" id="verification_code" name="verification_code" required>
        <button type="submit" data-translate="button-verify">Verify Code</button>
    </form>
    <div class="footer">
        <p data-translate="footer-text">Didn't receive a code? <a href="{% url 'accounts:register' %}" data-translate="footer-link">Try again</a></p>
    </div>
</div>

<script src="{% static 'accounts/verify_code.js' %}"></script>
</body>
</html>
